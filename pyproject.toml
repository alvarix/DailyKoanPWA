[project]
name = "daily-koan-pwa"
version = "0.1.0"
# venv runs 3.9.6 (droplet: 3.12); the code avoids 3.10+ syntax by design
requires-python = ">=3.9"

[tool.pyright]
venvPath = "."
venv = "venv"
include = ["."]
exclude = ["venv", "templates"]

[tool.ruff]
target-version = "py39"
exclude = ["venv", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
