[project]
name = "daily-koan-pwa"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pyright]
venvPath = "."
venv = "venv"
include = ["."]
exclude = ["venv", "templates"]

[tool.ruff]
target-version = "py311"
exclude = ["venv", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
